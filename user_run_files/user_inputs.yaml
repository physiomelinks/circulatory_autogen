#_______ general inputs ________
DEBUG: false # TODO change back
# user_inputs_path_override: when set to an absolute path, every stage reads its config from
# that file instead of this one -- the way to keep a study's config outside the repo. Leave it
# commented out unless you are pointing at your own config; a committed value here would send
# every fresh clone to a file that only exists on one machine. Example:
# user_inputs_path_override: /abs/path/to/my_study/user_inputs.yaml
file_prefix: 3compartment 
# input_param_file must be stored in resources. If first creating a parameters file 
# set this to parameters_orig.csv and a 
# parameters file will be generated with spaces for the required parameters

# input_param_file: SN_simple_parameters.csv
input_param_file: 3compartment_parameters.csv

# cpp generation inputs
# model_type can be cellml_only, python, cpp, casadi_python, aadc_python or external_python.
# The first five are generated from the vessel/module CSV arrays; external_python is the one way
# to bring a model of your own -- a Python class that owns its time stepping, registered as
# SIM_HELPER and pointed at by external_model_path. See tutorial/docs/external-python-solvers.md
# and funcs_user/example_model_scipy/ for a small worked example.
# model_type: cpp
model_type: cellml_only
# model_type: casadi_python
# model_type: external_python

#__________ parameter identification inputs __________
# param_id_method can be any of [genetic_algorithm, CMA-ES, bayesian, sp_minimize, multi_start_sp_minimize]
param_id_method: genetic_algorithm
# param_id_method: CMA-ES
# param_id_method: sp_minimize
# multi_start_sp_minimize runs L-BFGS-B from many scattered starts, so it uses the gradient
# but still escapes local minima. It works for any model_type: AD gradients for casadi_python
# and aadc_python models, finite differences otherwise.
# param_id_method: multi_start_sp_minimize

#_______ Automatic Differentiation __________
do_ad: false

# pre_time is the amount of time simulated to get to steady state
# TODO this is not important if it is specified in the obs_data.json file
# TODO I should remove it here and only specify in the obs_data.json file?
pre_time: 20
# sim_time is the amount of simulation time where the outputs are compared to ground truth
# NOTE: If doing freq domain fitting make sure the simulation is periodic and the sim time is the period.
sim_time: 2

# specifying number of heart periods has been made obsolete. If you want to do this, do it when preprocessing
# and set the pre_time and sim_time accordingly.

# it is recommended that users create their own CA_user directory to store input resources and output generated model files. e.g.
# resources_dir: /home/farg967/Documents/temp/test_for_phlynx_cvs/resources
# generated_models_dir: /home/farg967/Documents/temp/CA_temp/generated_models
# param_id_output_dir: /home/farg967/Documents/git_projects/CA_user/3compartment/param_id_output
# external_modules_dir: /home/farg967/Documents/temp/test_for_phlynx_cvs/module_config

# Your own operation / cost / modifier funcs. The built-in ones ship inside the package
# (libcuflynx.funcs) and must not be edited -- an upgrade replaces them. Write yours in a file of
# your own and name it here; its funcs are registered alongside the built-ins with the same
# decorators. Templates: funcs_user/{operation,cost,modifier}_funcs_example.py, and see
# funcs_user/README.md. Absent/empty => only the built-in funcs.
# operation_funcs_external_path: funcs_user/my_operation_funcs.py
# cost_funcs_external_path: funcs_user/my_cost_funcs.py
# modifier_funcs_external_path: funcs_user/my_modifier_funcs.py


# This is for cpp generation
# cpp_generated_models_dir: /home/farg967/software/venous_system/lucas_model/fvm
cpp_generated_models_dir: 
  /home/farg967/Documents/git_projects/circulatory_autogen/generated_models/3compartment/
# This is for cpp_coupling
couple_to_1d: false
cpp_1d_model_config_path: 
  /home/farg967/software/venous_system/lucas_model/aortic_bif_coupling/run_dir/input1d.dat

# Output time step (sampling) 
dt: 0.01 # This should be smaller than all of the dt in your obs_data.json file.

# solver options are: CVODE_myokit (uses Myokit, default), CVODE_opencor (uses OpenCOR), RK4_cpp (RK4 in cpp), for Python models: solve_ivp, for CasADi Python models: casadi_integrator, or for external_python models: external
solver: CVODE_myokit
# These are inputs to solver_properties of the solver
solver_info:
  # Maximum time step for solver
  MaximumStep: 0.0001
  MaximumNumberOfSteps: 5000
  # method: RK45 # any method for solve_ivp
  # method: cvodes # any method for casadi ('cvodes', 'idas', 'collocation', 'rk')

# param_id_obs_path needs to be an absolute path.
# This for 3compartment
param_id_obs_path: /home/farg967/Documents/git_projects/circulatory_autogen/resources/3compartment_obs_data.json
# param_id_obs_path: /home/farg967/Documents/git_projects/circulatory_autogen/resources/3compartment_obs_data.json
# param_id_obs_path: 
#   /home/farg967/Documents/git_projects/circulatory_autogen/resources/SN_simple_obs_data.json
# param_id_obs_path: /hpc/bghi639/Software/circulatory_autogen/resources/simple_physiological_nonlinear_visco_obs_data.json

#_______ sensitivity analysis inputs __________
do_sensitivity: false

#______ optimiser options (for all optimisers) ___________
optimiser_options:
  # Common options (shared across optimisers):
  num_calls_to_function: 2000  # maximum function evaluations (default: 10000)
  cost_convergence: 0.001        # convergence tolerance (default: 0.0001)
  max_patience: 10              # max patience for convergence (default: 10)
  cost_type: gaussian_MLE  # use @is_MLE costs for MCMC / Laplace (see cost_funcs_user)
  # CMA-ES specific options:
  # sigma0: 0.1    # optional, initial standard deviation (default: 0.2 * mean(param_range))
  # multi_start_sp_minimize specific options:
  # num_starts: 10             # number of L-BFGS-B descents (default 10, or 4 when DEBUG)
  # start_sampling: sobol      # sobol (default), latin_hypercube or random
  # include_init_point: true   # make the first start the x0 from {file_prefix}_parameters.csv
  # seed: 0                    # seed for the start sampler, so runs are repeatable
  # fd_step: 1.0e-4            # finite-difference step, used when AD isn't available
  # no_new_starts_on_convergence: true  # true: stop launching starts once one converges.
  #                                     # false: run every start and report how many land in
  #                                     # each minimum (maps the basins of a multi-modal problem)
  # convergence_cluster_tol_frac: 0.02  # two converged starts are the same solution if every
  #                                     # param agrees to within this fraction of its range
  # Note: Initial parameter values (x0) are automatically loaded from {file_prefix}_parameters.csv

#______ debug optimiser options (used when DEBUG is True) ___________
debug_optimiser_options:
  num_calls_to_function: 30 # TODO change back to 30 for tests
  cost_convergence: 0.001
  cost_type: gaussian_MLE
  # Note: When DEBUG is True, debug_optimiser_options overrides optimiser_options

#______ uncertainty quantification inputs ___________
# Was do_mcmc / mcmc_options: MCMC is one UQ method rather than the whole of it, so `method`
# below is where other methods are selected as they are added. The old names still work and
# warn once.
do_uq: false
UQ_options:
  method: mcmc         # only 'mcmc' so far
  library: emcee       # sampler backend for method: mcmc
  num_steps: 1000
  num_walkers: 64
  burn_in: 0.5         # < 1 is a fraction of num_steps; >= 1 is a number of steps
  # TODO As above for cost_type
  cost_type: gaussian_MLE
  cost_convergence: 0.001

debug_UQ_options:
  method: mcmc
  library: emcee
  num_steps: 5
  num_walkers: 40
  burn_in: 0.5
  cost_type: gaussian_MLE
  cost_convergence: 0.001

sa_options:
  method: sobol
  sample_type: saltelli
  num_samples: 256 # this is multiplied by (2M + 2) to get the actual number of samples (M is the number of parameters).
    # output_dir: /non/default/path

# identifiability analysis
do_ia: false
ia_options:
  method: Laplace # profile_likelihood

#______ emulator (surrogate model) inputs ___________
# An emulator maps the params_for_id parameters to the scalar features of your obs_data.json
# data items -- the same numbers the cost is computed from. Train it once, and calibration,
# sensitivity analysis, MCMC/UQ and identifiability analysis can all evaluate it instead of the
# solver. The N training simulations are paid up front, so this wins for Sobol SA
# (num_samples*(2M+2) runs), MCMC and identifiability, and does NOT win for a single GA run.
#
# The two flags are independent:
#   do_emulation  - train an emulator (./run_emulator_training.sh <num_processors>)
#   use_emulator  - make the analyses evaluate the trained emulator
# `solver` above keeps naming the solver used to TRAIN, and to compare the emulator against.
# Needs the optional dependency: pip install "circulatory_autogen[emulation]"
do_emulation: false
use_emulator: false
emulator_settings:
  # Where the trained emulator lives.
  # Default: <param_id_output_dir>/emulators/<file_prefix>_<obs_prefix>
  # emulator_dir:
  # 'default' (autoemulate's default set), 'all', or a comma-separated list of emulator names
  models: default
  # Number of simulations run to build the training set
  num_train_samples: 128
  # Refit the design and simulated features a previous run already saved in emulator_dir
  # (training_data.npz) instead of running the simulations again -- for trying a different
  # `models` or fit setting for the cost of the fit alone. Runs no simulations, so
  # num_train_samples, sample_type and log_scale_params are ignored; needs a previous training
  # run (the first one must have this false), and is refused if the parameter bounds, obs_data,
  # protocol or model have changed since those samples were simulated.
  reuse_samples: false
  # Design over the params_for_id box: sobol, latin_hypercube or random
  sample_type: sobol
  # Space the design logarithmically (worth it when a bound spans decades; needs min > 0)
  log_scale_params: false
  random_seed: 0
  # Held out and never trained on -- this is what the reported R2/RMSE are measured against
  test_fraction: 0.2
  n_splits: 5
  n_iter: 10
  # Refuse to USE an emulator whose worst held-out per-feature R2 is below this. An emulator
  # below it does not fail loudly; it returns plausible wrong numbers.
  min_r2: 0.9
  # Outside its training box an emulator is extrapolating with no error estimate:
  # error (default), warn, or clip
  out_of_bounds: error
  # Relative step for the finite-difference gradient over the emulator
  fd_rel_step: 1.0e-3

plot_predictions: true
