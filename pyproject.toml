[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libcuflynx"
# Keep in step with the release tag: every release is accompanied by a chore PR bumping this.
# It had drifted to 0.1.0 while the published release was Version_0_2, so anything built from
# the tree reported a version lower than the one already out.
version = "0.3.0"
description = "Generation and calibration of CellML circulatory system models from module/vessel arrays"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [
    {name = "Finbar J. Argus"}
]
keywords = ["cellml", "circulatory", "modeling", "parameter-identification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.19.0",
    "pandas>=1.3.0",
    "pyyaml>=5.4.0",
    "mpi4py>=3.0.0",
    "matplotlib>=3.3.0",
    "scipy>=1.7.0",
    "emcee>=3.0.0",
    "corner>=2.2.0",
    "SALib==1.5.1",
    "seaborn>=0.11.0",
    "rdflib>=5.0.0",
    # libCellML 0.7.0 (released 2026-07-09) is a breaking change: it renames
    # Analyser.model() -> Analyser.analyserModel(), drops Generator.setModel()/setProfile() in
    # favour of arguments, changes the generated Python code (no VARIABLE_COUNT), and resolves
    # units differently when flattening (SN_simple then fails to connect a_2 across components).
    # The first two are handled by the shims in utilities/libcellml_helper_funcs.py; the last
    # two are a real migration. Pin below 0.7 until that is done -- without an upper bound CI
    # silently picks up 0.7.0 and every model-generating test fails.
    "libcellml>=0.6.3,<0.7.0",
    "ruamel.yaml>=0.17.0",
    "sympy>=1.8.0",
    "tqdm>=4.62.0",
    "statsmodels>=0.12.0",
    "schwimmbad>=0.3.0",
    "myokit>=1.39.1",
    "nevergrad>=1.0.12",
    "numdifftools>=0.9.0",
    "pint>=0.18",
    "casadi>=3.7.2",
    "scikit-learn"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# src/libcuflynx/obsolete is dead code kept in the tree for reference; it is not shipped.
# find() matches the dotted package name it discovers, hence the namespaced spelling as well.
exclude = ["obsolete*", "libcuflynx.obsolete*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-mpi>=0.6.0",
    "pytest-xdist>=2.5.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
# Optional UQ backends. Kept out of the core list on purpose: pytensor builds C
# extensions, and param_id/paramID.py is imported by every calibration run, so a hard
# dependency would make an ordinary calibration fail to import for anyone not doing UQ.
uq = [
    "pymc>=5.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "black>=22.0.0",  # used by mkdocstrings to format rendered signatures
]
# Surrogate (emulator) models -- issue #333. Optional because autoemulate pulls in torch,
# gpytorch, pyro-ppl and lightgbm, and requires Python >=3.10,<3.13, which is narrower than
# this project's floor. CA imports it only when do_emulation/use_emulator is set, and says so
# by name when it is missing.
emulation = [
    "autoemulate>=2.1,<3",
]

[tool.pytest.ini_options]
# Pytest configuration
# NOTE: Tests should be run using the OpenCOR Python shell.
# Use ./run_pytest.sh to run tests, which automatically uses the Python
# from python_path.sh
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "manual: never collected without --run-manual; too slow for CI or a normal local run",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "mpi: marks tests that require MPI",
    "need_opencor: marks tests that require OpenCOR backend availability",
    "need_autogen: waits for all autogeneration tests to finish before running",
    "solver: marks solver-focused tests",
    "one_rank_task: marks an autogeneration test that signals completion",
    "autogen_task: marks an autogeneration test that signals completion",
    "misc_task: marks a one-rank miscellaneous integration test",
    "autogen_rank(idx): autogeneration test assigned rank index",
    "solver_task: marks a solver test that signals completion",
    "compare_optimisers: marks compare_optimisers tests",
    "full_scale_model: calibrates a whole-circulation model rather than a small one, so it takes minutes rather than seconds; CI splits the param_id jobs on this marker to halve their wall clock",
    "xdist_group(name): group marker used by pytest-xdist to serialize groups",
]
# Coverage options
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | generated_models
)/
'''

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

